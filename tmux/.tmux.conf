# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Source config
bind r source-file ~/.tmux.conf \; display-message "Source ~/.tmux.conf"

# General
set -sg escape-time 0
setw -g mode-keys vi
set -g status-keys vi
set -g mouse off
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1

# Color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Status bar
set -g status-style bg=colour0,fg=colour250
set -g window-status-current-style bg=colour250,fg=color0,bold
set -g window-status-current-format " #I:#W "
set -g window-status-style fg=colour250
set -g window-status-format " #I:#W "
set -g status-left "#[fg=colour244] #S #[fg=colour250]|"
set -g status-right "#[fg=colour250]#(whoami)@#H #[fg=colour250]| %H:%M | %Y-%m-%d"
set -g status-right-length 100
set -g status-interval 5
set -g status-position top

# Activity
setw -g monitor-activity on
set -g visual-activity on

# Keybinds
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
